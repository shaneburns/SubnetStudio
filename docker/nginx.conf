server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # Any path that doesn't match a real file falls back to index.html so
    # the React PWA router handles it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Vite hashed assets — cache aggressively ───────────────────────────────
    # Vite stamps filenames with a content hash (e.g. index-Bt7gw2L5.js),
    # so these are safe to cache for 1 year.
    location ~* /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── PWA service worker — never cache ─────────────────────────────────────
    location ~* (registerSW\.js|sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Compression ───────────────────────────────────────────────────────────
    gzip on;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        application/manifest+json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;
}
